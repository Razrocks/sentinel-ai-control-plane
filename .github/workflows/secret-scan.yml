# Phase 5.3 — secret scan CI gate.
#
# Runs on every push + PR. Fails the build if the secret scanner finds
# anything matching the patterns in scripts/secret-scan.mjs (Anthropic
# keys, AWS keys, JWTs, private keys, high-entropy tokens near secret
# names). Scans the entire tree on CI — local pre-commit only scans
# staged files for speed, so CI is the safety net that catches anything
# the hook missed (or that was committed with --no-verify).
name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scanner sees every committed blob, not
          # just the HEAD snapshot.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run secret scan
        run: node scripts/secret-scan.mjs
