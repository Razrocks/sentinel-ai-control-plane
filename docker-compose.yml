services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-db
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sentinel-backend
    ports:
      - "3001:3001"
    # Load secrets from backend/.env (gitignored). Container-only overrides below.
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL because in-container Postgres host is "postgres" not "localhost"
      DATABASE_URL: postgresql://sentinel:sentinel_dev@postgres:5432/sentinel
      PORT: "3001"
      HOST: "0.0.0.0"
      CORS_ORIGIN: "http://localhost:5173"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
